<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Супер козел</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--bg:#2a5c4b;--bg2:#17382d;--paper:#f7f3e6;--ink:#1c2420;--red:#c0332d;--redt:#ff8a80;--gold:#f0c24b;--text:#eef3ee;--mut:#a9c2b6;--chip:rgba(10,30,24,.5);--back:repeating-linear-gradient(45deg,#2b6a8c 0 5px,#3a7ea3 5px 10px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d4538;--bg2:#10281f;--paper:#e9e4d3;--text:#e4ece6;--mut:#8fae9f}}
:root[data-theme="dark"]{--bg:#1d4538;--bg2:#10281f;--paper:#e9e4d3;--text:#e4ece6;--mut:#8fae9f}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg2);color:var(--text);font-family:Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:8px 12px 10px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rnd{font-size:12px;color:var(--mut);margin-bottom:4px}
.side{display:flex;gap:8px;align-items:baseline;font-size:14px}
.side b{font-size:22px;color:var(--gold)}
.trump{text-align:center;background:var(--chip);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--mut);white-space:nowrap}
.trump b{display:block;font-size:30px;line-height:1.1;color:var(--paper)}
.trump b.red{color:var(--redt)}
.seats{display:flex;justify-content:space-around;margin:8px 0 2px;min-height:78px}
.seat{text-align:center;font-size:12px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 2px;border:2px solid transparent}
.seat.on .av{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.seat.on{color:var(--gold);font-weight:700}
.fan{display:flex;justify-content:center;margin-top:3px;min-height:31px}
.b{display:block;width:22px;height:31px;border-radius:4px;background:var(--back);border:2px solid var(--paper);box-sizing:border-box;margin-left:-12px}
.b:first-child{margin-left:0}
.felt{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding-left:104px;background:radial-gradient(ellipse at 50% 45%,var(--bg) 0,var(--bg2) 100%);border-radius:22px;margin:6px 0;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.deck{position:absolute;left:8px;top:50%;width:104px;height:100px;margin-top:-50px}
.tcard{position:absolute;left:4px;top:12px;width:54px;transform:rotate(90deg)}.tcard.old{opacity:.55}
.tcard2{position:absolute;left:62px;top:8px;width:54px;transform:rotate(-10deg);z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.45);border-radius:9px}
.pile{position:absolute;left:58px;top:10px;width:54px;height:76px}
.pb{position:absolute;width:54px;height:76px;border-radius:8px;background:var(--back);border:3px solid var(--paper);box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.dcount{position:absolute;left:58px;top:86px;width:54px;text-align:center;font-size:13px;color:var(--mut)}
#tab{display:grid;place-items:center;min-height:130px}
.slot{grid-area:1/1;position:relative;text-align:center;font-size:11px;color:var(--mut);margin:2px 4px}.slot small{position:absolute;left:-20px;right:-20px;top:100%;margin-top:3px;white-space:nowrap}
.slot .cards{display:flex;justify-content:center;margin-bottom:3px}.slot .card{width:var(--tw,56px)}.slot .card+.card{margin-left:calc(var(--tw,56px)*-.55)}.cb{background:var(--back);border:3px solid var(--paper);padding:0}
.card{aspect-ratio:5/7;background:var(--paper);color:var(--ink);border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;box-sizing:border-box;font-weight:700;font-size:16px;line-height:1;user-select:none;box-shadow:0 2px 3px rgba(0,0,0,.35);text-align:left}
.card b{font-size:26px;align-self:center;margin-bottom:6px}
.card.red{color:var(--red)}
.msg{text-align:center;min-height:22px;margin:2px 0 4px;font-size:15px}
.hand{display:flex;justify-content:center;padding:16px 0 4px;min-height:100px}
.hand .card{width:62px;margin-left:-14px;position:relative;top:0;cursor:pointer;transition:top .22s cubic-bezier(.22,1,.36,1);transform-origin:50% 130%}
.hand .card:first-child{margin-left:0}
.hand .card.sel{top:-14px}
.act{text-align:center;min-height:50px}.act .btn{margin:0 4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.ov[hidden]{display:none}
.box{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px;max-width:360px;width:100%}
.box h2{margin:0 0 10px;font-size:24px}
.box p{margin:6px 0;line-height:1.4}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.12)}
.btn{background:var(--gold);color:#1c2420;border:0;border-radius:12px;padding:12px 18px;font:700 16px Rubik,system-ui,sans-serif;margin:8px 6px 0 0;cursor:pointer}
.box input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:10px;border:1px solid rgba(0,0,0,.25);font:16px Rubik,system-ui,sans-serif;background:#fff;color:#1c2420}
.btn.alt{background:rgba(0,0,0,.12);color:var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #fff}
@media(prefers-reduced-motion:reduce){.hand .card{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div><div class="rnd" id="rnd"></div><div id="sc"></div></div><div class="trump" id="tr"></div></div>
  <div class="seats" id="seats"></div>
  <div class="felt"><div class="deck" id="deck"></div><div id="tab"></div></div>
  <div class="msg" id="msg"></div>
  <div class="act" id="act"></div>
  <div class="hand" id="hand"></div>
</div>
<div class="ov" id="ov"></div>
<script>
const SUITS=['♠','♥','♦','♣'],RANKS=['6','7','8','9','J','Q','K','10','A'],PTS={'6':0,'7':0,'8':0,'9':0,J:2,Q:3,K:4,'10':10,A:11};
const TARGET=24,THR=41,AV=['','🐐','🐑','🐂'];
const $=s=>document.querySelector(s);
let n=4,sd,scores,round=0,hands,stock,trump,drawn,flipped,leader,trick,order=[],queue=[],extra=false,tp,tc,msg='',ready=false,sel=new Set(),mode='bots',names=[],mySeat=0,H=new Set(),lastSnaps={},lastRaw='',ovData=null,myId='',timers=[],es=null,tables=[],cur=null,nick='',connNick='',quick=false;
const pw=c=>RANKS.indexOf(c.r),pt=c=>PTS[c.r],red=s=>s==='♥'||s==='♦';
const nm=q=>q?names[(q+mySeat)%n]||'Бот '+q:'Вы',sn=s=>s.map(nm).join(' + '),T=k=>`⟦${k}⟧`,fmt=s=>s.replace(/⟦(\d)⟧/g,(_,k)=>nm((+k-mySeat+n)%n));
const hum=p=>p===0||(mode==='host'&&H.has(p));
const beats=(c,b,t)=>c.s===b.s?pw(c)>pw(b):(c.s===t&&b.s!==t);
function find(rs,bs,i=0,u=[],o=[]){
  if(i===bs.length)return o.slice();
  for(let j=0;j<rs.length;j++)if(!u[j]&&beats(rs[j],bs[i],trump)){u[j]=1;o[i]=rs[j];const r=find(rs,bs,i+1,u,o);if(r)return r;u[j]=0}
  return null;
}
const beatsCombo=(rs,bs)=>rs.length===bs.length&&!!find(rs,bs);
const best=()=>trick.slice(1).reduce((b,x)=>beatsCombo(x.cs,b.cs)?x:b,trick[0]);
const setOrder=()=>{order=[];for(let k=0;k<n;k++){const p=(leader+k)%n;if(hands[p].length)order.push(p)}queue=order.slice();extra=false};
const turnP=()=>queue.length?queue[0]:(extra?order[0]:-1);
const maxK=()=>Math.min(...hands.filter(h=>h.length).map(h=>h.length));
const key=c=>(c.s===trump?100:0)+pw(c);
function bot(h){
  if(!trick.length){const nt=h.filter(c=>c.s!==trump),a=nt.length?nt:h;return[a.reduce((x,c)=>pw(c)>pw(x)?c:x)]}
  const b=best().cs,k=Math.min(trick[0].cs.length,h.length);
  const out=find([...h].sort((x,y)=>key(x)-key(y)),[...b].sort((x,y)=>key(y)-key(x)));
  if(out)return out;
  const d=c=>pt(c)*1000+key(c);
  return[...h].sort((x,y)=>d(x)-d(y)).slice(0,k);
}
const card=(c,cls='',st='')=>`<div class="card ${red(c.s)?'red':''} ${cls}" style="${st}"><span>${c.r}</span><b>${c.s}</b></div>`;
const deckRect=()=>{const e=$('.pile');return e?e.getBoundingClientRect():null};
function fly(el,from,o={}){
  if(!el||!from)return;
  const to=el.getBoundingClientRect(),own=getComputedStyle(el).transform,ot=own==='none'?'':own;
  const dx=from.left+from.width/2-(to.left+to.width/2),dy=from.top+from.height/2-(to.top+to.height/2);
  el.animate([{transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width}) ${ot}`,opacity:o.fade?0:1},{opacity:1,offset:.2},{transform:ot||'none',opacity:1}],
    {duration:o.d||520,delay:o.delay||0,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
}
function render(){
  const turn=turnP(),mine=ready&&turn===0;
  hands[0].sort((a,b)=>SUITS.indexOf(a.s)-SUITS.indexOf(b.s)||pw(a)-pw(b));
  $('#rnd').textContent=`Раунд ${round}, проигрывает набравший ${TARGET}`;
  $('#sc').innerHTML=sd.map((s,i)=>`<div class="side"><span>${sn(s)}</span><b>${scores[i]}</b></div>`).join('');
  $('#tr').innerHTML=`<b class="${red(trump)?'red':''}">${trump}</b>козырь`;
  $('#seats').innerHTML=[...Array(n).keys()].slice(1).map(p=>`<div class="seat ${turn===p?'on':''}" id="seat${p}"><div class="av">${AV[p]}</div>${nm(p)}<div class="fan">${hands[p].map(()=>'<i class="b"></i>').join('')}</div></div>`).join('');
  const dk=Math.min(stock.length,8),up=stock.length?stock[0]:null,top=flipped&&stock.length>1?stock[1]:null;
  $('#deck').innerHTML=up?`<div class="tcard${top?' old':''}">${card(up)}</div><div class="pile">${Array.from({length:dk},(_,i)=>`<div class="pb" style="left:${-i*1.5}px;top:${-i*1.5}px"></div>`).join('')}</div>${top?`<div class="tcard2" id="flipc">${card(top)}</div>`:''}<div class="dcount">${stock.length}</div>`:`<div class="dcount" style="left:10px;top:40px;width:84px">Колода пуста</div>`;
  const mx=Math.max(0,...trick.map(t=>t.cs.length)),tw=mx<=3?68:mx<=5?56:46;
  $('#tab').style.setProperty('--tw',tw+'px');
  let dj=0;
  $('#tab').innerHTML=trick.map((t,k)=>{const off=k===0?'0px,0px':t.down?`${-12-5*dj}px,${-9-4*dj++}px`:`${12+6*(k-1)}px,${14+6*(k-1)}px`;
    return `<div class="slot" style="z-index:${k===0?1:t.down?0:k+1};transform:translate(${off}) rotate(${t.rot}deg)"><div class="cards">${t.cs.map(c=>t.down?'<div class="card cb"></div>':card(c)).join('')}</div>${k===0?`<small>${nm(t.p)}</small>`:''}</div>`}).join('');
  $('#msg').textContent=fmt(msg)||(!ready?'Раздача…':mine?(extra?'Можете бить дальше: выберите карты или нажмите «Пас»':trick.length?`Выберите карт: ${trick[0].cs.length}. Что не бьёт, закроется`:'Ваш ход: выберите карты и нажмите «Ходить»'):turn>0?nm(turn)+' думает…':'');
  $('#act').innerHTML=mine?(extra?'<button class="btn pass">Пас</button>':'')+(sel.size?'<button class="btn go">Ходить</button>':''):'';
  const k=hands[0].length;
  $('#hand').innerHTML=hands[0].map((c,i)=>{const d=i-(k-1)/2;return card(c,sel.has(c)?'sel':'',`transform:rotate(${d*4}deg) translateY(${Math.abs(d)*2}px)`)}).join('');
  if(mode==='host')push();
}
$('#hand').addEventListener('click',e=>{
  const el=e.target.closest('.card');if(!ready||!el||turnP()!==0)return;
  const c=hands[0][[...$('#hand').children].indexOf(el)];
  sel.has(c)?sel.delete(c):sel.add(c);msg='';render();
});
function check(h,cs,ext){
  if(!cs.length)return'Выберите карты';
  if(trick.length){
    const need=Math.min(trick[0].cs.length,h.length);
    if(cs.length!==need)return`Нужно сыграть карт: ${need}`;
    if(ext&&!beatsCombo(cs,best().cs))return'Эти карты не бьют';
  }else{
    if(cs.length>maxK())return'Столько карт нельзя: у соперников их меньше';
    if(!(cs.every(c=>c.s===cs[0].s)||cs.every(c=>c.r===cs[0].r)))return'Несколько карт можно ходить одной масти или одного достоинства';
  }
  return null;
}
function send(m){relay(0,'a',m)}
$('#act').addEventListener('click',e=>{
  const bt=e.target.closest('button');if(!bt||!ready||turnP()!==0)return;
  if(bt.classList.contains('pass')){
    sel.clear();msg='';
    if(mode==='guest'){send({k:'pass'});return render()}
    extra=false;render();setTimeout(resolve,300);return;
  }
  const cs=hands[0].filter(c=>sel.has(c)),err=check(hands[0],cs,extra);
  if(err){msg=err;return render()}
  const ex=extra;sel.clear();msg='';
  if(mode==='guest'){send({k:'play',cs:cs.map(c=>c.r+c.s),ext:ex});return render()}
  play(0,cs,ex);
});
function play(p,cs,ext=false){
  const src=p===0?$('#hand').children[hands[0].indexOf(cs[0])]:($('#seat'+p+' .fan').lastElementChild||$('#seat'+p));
  const from=src.getBoundingClientRect(),down=trick.length>0&&!ext&&!beatsCombo(cs,best().cs);
  hands[p]=hands[p].filter(x=>!cs.includes(x));trick.push({p,cs,down,rot:Math.round(Math.random()*12-6)});
  if(ext){queue=order.slice(1).filter(q=>hands[q].length);extra=false}else queue.shift();
  render();const el=$('#tab').lastElementChild;fly(el,from,{d:560});if(el&&trick.length>1&&!down)el.firstElementChild.animate([{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:220,delay:400,easing:'cubic-bezier(.3,1.6,.5,1)',fill:'backwards'});next();
}
function next(){
  if(queue.length){const p=queue[0];if(!hum(p))setTimeout(()=>play(p,bot(hands[p])),750);return}
  const L=order[0],b=best();
  if(b.p!==L&&hands[L].length&&find(hands[L],b.cs)){
    if(hum(L)){extra=true;render();return}
    setTimeout(()=>play(L,bot(hands[L]),true),750);return;
  }
  setTimeout(resolve,1000);
}
function resolve(){extra=false;
  const w=best(),all=trick.flatMap(t=>t.cs),sum=all.reduce((a,c)=>a+pt(c),0);
  tp[w.p]+=sum;tc[w.p]+=all.length;leader=w.p;
  msg=`${T(w.p)} берёт взятку (+${sum})`;render();
  const tr=(w.p===0?$('#hand'):$('#seat'+w.p)).getBoundingClientRect();
  [...$('#tab').children].forEach((el,i)=>{const r=el.getBoundingClientRect();
    el.animate([{transform:el.style.transform,opacity:1},{transform:`translate(${tr.left+tr.width/2-(r.left+r.width/2)}px,${tr.top+tr.height/2-(r.top+r.height/2)}px) scale(.4)`,opacity:0}],{duration:650,delay:350+i*70,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'})});
  setTimeout(()=>{
    const f=deckRect(),pushed=[];let flipNow=false;trick=[];msg='';
    for(let go=true;go&&stock.length;){go=false;
      for(let k=0;k<n;k++){const p=(leader+k)%n;
        if(hands[p].length<6&&stock.length){const c=stock.pop();hands[p].push(c);pushed.push({p,c});drawn++;go=true;
          if(drawn>=6&&!flipped&&stock.length>1){const fc=stock.pop();stock.splice(1,0,fc);flipped=true;trump=fc.s;flipNow=true;msg='Новый козырь '+trump+' (козырь меняется один раз)'}}}}
    if(hands.every(h=>!h.length))return endRound();
    setOrder();render();
    pushed.forEach(({p,c},j)=>fly(p===0?$('#hand').children[hands[0].indexOf(c)]:$('#seat'+p+' .fan').children[hands[p].indexOf(c)],f,{delay:j*110,d:560,fade:true}));
    if(flipNow)flipAnim();
    setTimeout(next,Math.min(pushed.length,12)*110+600);
  },1150);
}
function endRound(){
  const sp=sd.map(s=>s.reduce((a,p)=>a+tp[p],0)),sc=sd.map(s=>s.reduce((a,p)=>a+tc[p],0)),pen=sd.map(()=>0);
  const low=Math.min(...sp),ls=sp.flatMap((x,i)=>x===low?[i]:[]);
  if(ls.length===1){const i=ls[0];pen[i]=sc[i]===0?6:sp[i]>=THR?2:4}
  scores=scores.map((s,i)=>s+pen[i]);
  const over=Math.max(...scores)>=TARGET,L=scores.indexOf(Math.max(...scores));
  ovData={sp,pen,tot:scores.slice(),over,L,tie:ls.length!==1,r:round};
  showRound(ovData,true);
  if(mode==='host')push();
}
function showRound(o,canNext){
  $('#ov').innerHTML=`<div class="box"><h2>Раунд ${o.r}</h2>`+
    sd.map((s,i)=>`<div class="row"><span>${sn(s)}</span><span>${o.sp[i]} очков, штраф ${o.pen[i]?'+'+o.pen[i]:0}, всего ${o.tot[i]}</span></div>`).join('')+
    (o.over?`<p><b>Проиграли: ${sn(sd[o.L])}.</b> Набрали ${o.tot[o.L]}, это козёл!</p><button class="btn" id="go">В меню</button>`
      :`<p>${o.tie?'Ничья по очкам, штрафа нет.':''}</p>`+(canNext?'<button class="btn" id="go">Следующий раунд</button>':'<p>Ждём, пока хозяин стола начнёт следующий раунд…</p>'))+`</div>`;
  $('#ov').hidden=false;
  const g=$('#go');if(g)g.onclick=()=>o.over?leaveGame():newRound();
}
function dealAnim(){const f=deckRect();if(!f)return;
  hands.forEach((h,p)=>[...(p===0?$('#hand'):$('#seat'+p+' .fan')).children].forEach((el,i)=>fly(el,f,{delay:300+(i*n+p)*110,d:600,fade:true})));
  const t=$('.tcard');if(t)t.animate([{opacity:0,transform:'rotate(90deg) translateY(-34px)'},{opacity:1,transform:'rotate(90deg)'}],{duration:700,delay:300+6*n*110,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  const pl=$('.pile');if(pl)pl.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'none'}],{duration:320,easing:'ease-in-out'});
}
function flipAnim(){const fc=$('#flipc'),b=$('#tr b');
  if(fc)fc.animate([{opacity:0,transform:'rotate(-10deg) translateY(-30px) scale(.7)'},{opacity:1,transform:'rotate(-10deg)'}],{duration:800,delay:200,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  if(b)b.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:900,delay:450,easing:'ease-in-out'})}
function newRound(){
  round++;const d=[];SUITS.forEach(s=>RANKS.forEach(r=>d.push({r,s})));
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  hands=Array.from({length:n},()=>d.splice(-6));stock=d;trump=stock[0].s;drawn=0;flipped=false;ready=false;sel.clear();ovData=null;
  tp=Array(n).fill(0);tc=Array(n).fill(0);leader=Math.floor(Math.random()*n);trick=[];msg='';setOrder();
  $('#ov').hidden=true;render();
  dealAnim();
  setTimeout(()=>{ready=true;render();next()},300+6*n*110+1100);
}
function begin(k){mode='bots';mySeat=0;names=[];H=new Set([0]);n=k;sd=n===4?[[0,2],[1,3]]:[...Array(n).keys()].map(i=>[i]);scores=sd.map(()=>0);round=0;newRound()}
function leaveGame(){stopNet();leaveTable();menu()}

/* ---------- сеть: хозяин считает игру, друг получает своё представление ---------- */
function push(force){
  if(mode!=='host')return;
  const c=x=>x.r+x.s,L=(p,s)=>(p-s+n)%n,T2=(a,s)=>n===4?a.map((_,t)=>a[(t+s)%2]):a.map((_,q)=>a[(q+s)%n]);
  for(const s of H){if(!s)continue;
    const o={h:hands[s].map(c),nn:hands.map((_,q)=>hands[(q+s)%n].length),st:stock.length,f:stock.length?c(stock[0]):null,l:flipped&&stock.length>1?c(stock[1]):null,
      t:trump,fl:flipped,tr:trick.map(t=>({p:L(t.p,s),cs:t.down?t.cs.map(()=>'??'):t.cs.map(c),d:t.down,rot:t.rot})),
      o:order.map(p=>L(p,s)),q:queue.map(p=>L(p,s)),x:extra,ld:L(leader,s),sc:T2(scores,s),rd:round,rdy:ready,m:msg,nm:names,
      ov:ovData?{sp:T2(ovData.sp,s),pen:T2(ovData.pen,s),tot:T2(ovData.tot,s),over:ovData.over,L:n===4?((ovData.L-s)%2+2)%2:L(ovData.L,s),tie:ovData.tie,r:ovData.r}:null};
    const j=JSON.stringify(o);if(!force&&j===lastSnaps[s])continue;lastSnaps[s]=j;relay(s,'s',o)}
}
function onState(d){
  if(mode!=='guest')return;
  const raw=JSON.stringify(d);if(raw===lastRaw)return;lastRaw=raw;const newR=d.rd!==round,wasF=flipped;
  const P=s=>({r:s.slice(0,-1),s:s.slice(-1)}),ph=()=>({r:'?',s:'?'}),keys=[...sel].map(c=>c.r+c.s);
  names=d.nm;hands=[d.h.map(P),...d.nn.slice(1).map(k=>Array.from({length:k},ph))];
  stock=Array.from({length:d.st},ph);if(d.st){if(d.f)stock[0]=P(d.f);if(d.l&&d.st>1)stock[1]=P(d.l)}
  trump=d.t;flipped=d.fl;trick=d.tr.map(t=>({p:t.p,cs:t.cs.map(P),down:t.d,rot:t.rot}));
  order=d.o;queue=d.q;extra=d.x;leader=d.ld;scores=d.sc;round=d.rd;ready=d.rdy;msg=d.m;
  sel.clear();hands[0].forEach(c=>{if(keys.includes(c.r+c.s))sel.add(c)});
  if(d.ov)showRound(d.ov,false);else $('#ov').hidden=true;
  render();
  if(newR)dealAnim();else if(d.fl&&!wasF)flipAnim();
}
function onAction(s,m){
  if(mode!=='host'||!H.has(s)||!ready||turnP()!==s||!m)return;
  if(m.k==='pass'){if(extra){extra=false;render();setTimeout(resolve,300)}return}
  if(m.k!=='play'||!Array.isArray(m.cs))return;
  const pool=[...hands[s]],cs=[];
  for(const d of m.cs){const i=pool.findIndex(c=>c.r+c.s===d);if(i<0)return;cs.push(pool.splice(i,1)[0])}
  if(check(hands[s],cs,extra)!==null)return;
  play(s,cs,extra);
}
const st=t=>{const e=$('#nst');if(e)e.textContent=t};
let peer=null,conns=[],hostConn=null,role=null,tn=2,tstart=false,hnames=[];
const pid=k=>'skozel-'+[...k.toLowerCase()].map(c=>c.codePointAt(0).toString(36)).join('-');
const clean=v=>String(v||'').replace(/[<>&"]/g,'').trim().slice(0,16);
function relay(to,topic,data){try{(mode==='host'?conns[to]:hostConn).send({t:topic,v:data})}catch(e){}}
function stopNet(){timers.forEach(clearInterval);timers=[];mode='bots'}
function openPeer(cb){
  if(peer&&peer.open&&connNick===nick)return cb();
  if(peer){try{peer.destroy()}catch(e){}peer=null}
  if(!window.Peer){st('Нужен интернет: не загрузилась библиотека связи.');return}
  connNick=nick;peer=new Peer(pid(nick));
  peer.on('open',cb);peer.on('connection',onConn);
  peer.on('error',e=>{st(e.type==='unavailable-id'?'Ник занят: выберите другой.':e.type==='peer-unavailable'?'Игрок с таким ником не найден. Пусть создаст стол.':'Ошибка связи: '+e.type);if(e.type==='unavailable-id'){peer=null;connNick=''}})
}
const hostInfo=i=>({title:'Стол '+nick,n:tn,names:hnames,seat:i});
function broadcast(){conns.forEach((c,i)=>c&&c.send({t:'table',v:hostInfo(i)}));cur=hostInfo(0);tableView()}
function onConn(c){
  c.on('open',()=>{
    if(role!=='h'||tstart||conns.length>=tn){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
    conns.push(c);hnames.push(clean(c.metadata&&c.metadata.name)||'Игрок');
    c.on('data',m=>{if(m&&m.t==='a'&&tstart)onAction(conns.indexOf(c),m.v)});
    c.on('close',()=>{const i=conns.indexOf(c);if(i<0||role!=='h')return;
      if(!tstart){conns.splice(i,1);hnames.splice(i,1);broadcast()}
      else{conns.forEach(o=>{try{o.send&&o.send({t:'closed'})}catch(e){}});closedBox()}});
    if(conns.length===tn)startHost();else broadcast();
  });
}
function startHost(){if(tstart||role!=='h')return;tstart=true;conns.forEach((c,i)=>c&&c.send({t:'start',v:{names:hnames,n:tn,seat:i}}));startNet({names:hnames,n:tn,seat:0})}
function hostTable(k){if(!nick)return;openPeer(()=>{role='h';tn=k;conns=[null];hnames=[nick];tstart=false;broadcast()})}
function joinFriend(fn){
  openPeer(()=>{
    if(pid(fn)===pid(nick))return st('Это ваш ник.');
    const c=peer.connect(pid(fn),{metadata:{name:nick},reliable:true});hostConn=c;role='g';st('Подключаемся…');
    const to=setTimeout(()=>{st('Не нашли стол игрока «'+fn+'».');role=null;try{c.close()}catch(e){}},12000);
    c.on('open',()=>clearTimeout(to));
    c.on('data',m=>{if(!m)return;
      if(m.t==='table'){cur=m.v;tableView()}else if(m.t==='start')startNet(m.v);else if(m.t==='s')onState(m.v);
      else if(m.t==='full'){role=null;st('Стол занят или игра уже идёт.')}else if(m.t==='closed')closedBox()});
    c.on('close',()=>{if(role==='g'&&(cur||mode==='guest'))closedBox()});
  });
}
function closedBox(){stopNet();leaveTable();box('<h2>Стол закрыт</h2><p>Игрок вышел из игры.</p><button class="btn" id="bk">В меню</button>');on('#bk',menu)}
function leaveTable(){
  const r=role;role=null;cur=null;
  if(r==='h'){conns.forEach(c=>{if(c)try{c.send({t:'closed'});setTimeout(()=>c.close(),300)}catch(e){}});conns=[]}
  if(r==='g'&&hostConn){try{hostConn.close()}catch(e){}}hostConn=null;
}
function startNet(d){
  mode=d.seat===0?'host':'guest';mySeat=d.seat;n=d.n;cur=null;
  names=Array.from({length:n},(_,i)=>d.names[i]||'Бот '+i);H=new Set(d.names.map((_,i)=>i));
  sd=n===4?[[0,2],[1,3]]:[...Array(n).keys()].map(i=>[i]);scores=sd.map(()=>0);round=0;lastSnaps={};lastRaw='';
  hands=[[]];stock=[];trick=[];order=[];queue=[];ready=false;view='game';
  if(mode==='host'){timers.push(setInterval(()=>push(true),3000));newRound()}
  else box('<h2>Игра начинается</h2><p>Ждём первую раздачу…</p>');
}
/* ---------- меню ---------- */
const box=h=>{$('#ov').innerHTML=`<div class="box">${h}</div>`;$('#ov').hidden=false};
const on=(s,f)=>{$('#ov').querySelector(s).onclick=f};
let view='menu';
function menu(){view='menu';
  box(`<h2>🐐 Супер козел</h2><p>Карточная игра на 2-4 игрока.</p><input id="nk" placeholder="Ваш ник" maxlength="16" value="${nick}"><button class="btn" id="b2">Создать стол</button><button class="btn alt" id="b1">С ботами</button><button class="btn alt" id="b3">Правила</button><input id="fn" placeholder="Ник друга, к которому подключиться" maxlength="16"><button class="btn" id="b0">Найти друга по нику</button><p id="nst"></p>`);
  const nk=()=>{nick=clean($('#nk').value);if(!nick)st('Введите свой ник.');return nick};
  on('#b1',pickBots);on('#b3',rules);
  on('#b2',()=>{if(nk())box(`<h2>Сколько игроков?</h2><p>Друзья найдут вас по нику «${nick}». Свободные места займут боты.</p>${[2,3,4].map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}<br><button class="btn alt" id="bk">Назад</button><p id="nst"></p>`)||0;
    $('#ov').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>hostTable(+b.dataset.k));on('#bk',menu)});
  on('#b0',()=>{if(!nk())return;const f=clean($('#fn').value);if(!f)return st('Введите ник друга.');joinFriend(f)});
}
function tableView(){view='table';const t=cur;
  box(`<h2>${t.title}</h2><p>${t.seat===0?`Пусть друзья введут ник «${nick}» в поле «Ник друга».`:'Вы за столом.'} Стол на ${t.n}.</p>`+
    Array.from({length:t.n},(_,i)=>`<div class="row"><span>${i+1}. ${t.names[i]||'свободно'}</span><span>${i?'':'хозяин'}</span></div>`).join('')+
    (t.seat===0?'<button class="btn" id="st">Начать (боты займут пустые места)</button>':'<p>Ждём, пока хозяин начнёт игру…</p>')+'<button class="btn alt" id="lv">Выйти</button>');
  if(t.seat===0)on('#st',startHost);
  on('#lv',()=>{leaveTable();menu()});
}
function pickBots(){
  box(`<h2>Сколько игроков?</h2>${[2,3,4].map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}<br><button class="btn alt" id="bk">Назад</button>`);
  $('#ov').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>begin(+b.dataset.k));on('#bk',menu);
}
function rules(){
  box(`<h2>Правила</h2><p>Раздаётся по 6 карт, последняя карта колоды лежит лицом вверх и задаёт козырь. Когда из колоды возьмут первые 6 карт, рядом откроется вторая козырная карта, и козырь сменится один раз. Ходить можно любой картой или сразу несколькими одной масти либо одного достоинства.</p><p>Остальные отвечают тем же числом карт: бьют картой выше или козырем, а что не бьёт, кладётся рубашкой вверх. Если тот, кто ходил, может побить лучшие карты на столе, круг продолжается.</p><p>Взятку забирает тот, чьи карты лучшие. В конце раунда проигравший получает штраф: 2 очка, если набрал 41 или больше, 4, если меньше, и 6, если не взял ни одной карты. Кто дошёл до 24, тот козёл.</p><button class="btn" id="bk">Назад</button>`);
  on('#bk',menu);
}
myId=Math.random().toString(36).slice(2,10);
hands=[[]];stock=[];trump='♠';trick=[];scores=[];sd=[];
menu();
</script>
